[project]
name = "fit1056-hospital-management-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.2",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
format-and-lint = [
    "ruff>=0.14.14",
]
other = [
    "pre-commit>=4.5.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "migrations"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "S",
    "T",
    "UP",
    #    "D", # Docstring rules, enable soon
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
