[project]
name = "fit1056-hospital-management-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.2",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
format-and-lint = [
    "mypy>=1.19.1",
    "ruff>=0.14.14",
]
other = [
    "pre-commit>=4.5.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    "migrations"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "S",
    "T",
    "UP",
    #    "D", # Docstring rules, enable soon
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------
# Mypy Configuration
# -----------------------------------
[tool.mypy]
python_version = "3.13"
strict = true

exclude = ["migrations", "tests"]
plugins = [
    "pydantic.mypy"
]

namespace_packages = true
explicit_package_bases = true

# Strictness flags (already enabled by strict = true, but explicitly listed for clarity)
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # FastAPI decorators are untyped
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Error messages
show_error_codes = true
show_error_context = true
pretty = true
color_output = true

# Miscellaneous
strict_equality = true
strict_concatenate = true
